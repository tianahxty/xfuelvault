
{% extends "user/base.html" %}
 
{% block main-content %}
<div class="app no-shell"><div class="content" style="padding:0 22px">
    <div style="padding-top:60px;text-align:center">
      <div style="width:66px;height:66px;border-radius:50%;background:var(--line-soft);color:var(--ink-faint);display:flex;align-items:center;justify-content:center;margin:0 auto"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="30" height="30"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></div>
      <h1 style="font-size:20px;margin-top:18px">Redemption expired</h1>
      <!--
          CHANGE: litres value now comes from the real redemption record
          instead of a hardcoded "10.000L". Since nothing is deducted at
          QR-generation time, this message stays literally true: those
          litres never left the wallet in the first place.
      -->
      <p style="font-size:13px;color:var(--ink-soft);margin-top:6px;max-width:280px;margin-left:auto;margin-right:auto">This QR code is no longer valid. Your {{ redemption.litres_redeemed|default:"" }}L are safe in your wallet — nothing was deducted.</p>
      <a class="btn btn-primary" href="{% url 'redeem-fuel' %}" style="margin-top:26px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><path d="M14 14h2.5v2.5H14zM19 14h1.5M19 19h1.5M14 19h1"/></svg> Generate New QR</a>
      <a class="btn btn-secondary" href="{% url 'user_dashboard' %}" style="margin-top:10px">Back to Dashboard</a>
    </div>
    </div></div>
 
{% endblock  %}
